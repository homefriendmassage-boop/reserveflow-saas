<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการร้าน | ReserveFlow</title>
  <link rel="stylesheet" href="./assets/css/app.css">
  <script defer src="./assets/vendor/supabase-js/supabase.js"></script>
  <script type="module" src="./src/features/merchant-portal.js"></script>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><b>R</b>ReserveFlow</div>
    <a href="./index.html">กลับไปหน้าเดโม</a>
  </div>
</header>
<main>
  <section class="panel" id="merchantLogin">
    <h2>เข้าสู่ระบบร้านค้า</h2>
    <button type="button" id="merchantSignIn" class="btn primary" disabled>เข้าสู่ระบบด้วย LINE</button>
    <p class="sub">สำหรับเจ้าของร้าน แคชเชียร์ และพนักงานที่ได้รับสิทธิ์</p>
    <details>
      <summary>เข้าสู่ระบบด้วยอีเมล</summary>
      <form id="merchantEmailForm" class="fields">
        <div class="field"><label for="merchantEmail">อีเมล</label><input id="merchantEmail" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="merchantPassword">รหัสผ่าน</label><input id="merchantPassword" name="password" type="password" autocomplete="current-password" required></div>
        <div class="field"><button id="merchantEmailSignIn" type="submit" class="btn soft" disabled>เข้าสู่ระบบ</button></div>
      </form>
    </details>
  </section>
  <section class="panel hidden" id="merchantDashboard">
    <button type="button" id="merchantSignOut" class="btn soft">ออกจากระบบ</button>
    <h2>รายการจองของร้าน</h2>
    <div class="field">
      <label for="merchantShop">ร้านค้า</label>
      <select id="merchantShop"></select>
    </div>
    <p id="merchantRole"></p>
    <details id="merchantShopSettings" class="hidden">
      <summary>ตั้งค่าร้าน</summary>
      <form id="merchantShopSettingsForm" class="fields">
        <div class="field"><label for="merchantShopName">ชื่อร้าน</label><input id="merchantShopName" maxlength="100" required></div>
        <div class="field"><label><input id="merchantShopOpen" type="checkbox"> เปิดรับจองออนไลน์</label></div>
        <div class="field"><button class="btn soft" type="submit">บันทึกการตั้งค่า</button></div>
      </form>
      <h3>กำหนดสิทธิ์ทีมงาน</h3>
      <form id="merchantStaffRoleForm" class="fields">
        <div class="field"><label for="merchantStaffUid">User UID จาก Supabase Auth</label><input id="merchantStaffUid" required maxlength="36"></div>
        <div class="field"><label for="merchantStaffRole">สิทธิ์</label><select id="merchantStaffRole"><option value="cashier">แคชเชียร์</option><option value="staff">พนักงาน</option><option value="remove">นำสิทธิ์ออก</option></select></div>
        <div class="field"><button class="btn soft" type="submit">บันทึกสิทธิ์ทีมงาน</button></div>
      </form>
    </details>
    <details id="merchantTableLayout" class="hidden">
      <summary>จัดตำแหน่งโต๊ะบนผัง</summary>
      <form id="merchantTableLayoutForm">
        <div class="fields">
          <div class="field"><label for="merchantLayoutTable">โต๊ะ</label><select id="merchantLayoutTable" required></select></div>
          <div class="field"><label for="merchantLayoutX">ซ้าย → ขวา (%)</label><input id="merchantLayoutX" type="number" min="5" max="95" required></div>
          <div class="field"><label for="merchantLayoutY">บน → ล่าง (%)</label><input id="merchantLayoutY" type="number" min="5" max="95" required></div>
        </div>
        <div id="merchantLayoutPreview" class="plan customer-plan live-booking-plan" aria-label="ตัวอย่างตำแหน่งโต๊ะ"></div>
        <button type="submit" class="btn soft">บันทึกตำแหน่งโต๊ะ</button>
      </form>
    </details>
    <details id="merchantTableEditor" class="hidden">
      <summary>จองโต๊ะให้ลูกค้า</summary>
      <form id="merchantTableForm">
        <div class="fields">
          <div class="field"><label for="merchantTable">โต๊ะ</label><select id="merchantTable" required></select></div>
          <div class="field"><label for="merchantTableGuests">จำนวนคน</label><input id="merchantTableGuests" type="number" min="1" value="1" required></div>
          <div class="field"><label for="merchantTableMode">เวลาใช้โต๊ะ</label><select id="merchantTableMode"><option value="now">ตอนนี้</option><option value="scheduled">จองล่วงหน้า</option></select></div>
          <div class="field hidden"><label for="merchantTableDate">วันที่</label><input id="merchantTableDate" type="date" required disabled></div>
          <div class="field hidden"><label for="merchantTableTime">เวลาเริ่ม</label><select id="merchantTableTime" required disabled></select></div>
          <div class="field"><label for="merchantTableName">ชื่อผู้จอง (ไม่บังคับ)</label><input id="merchantTableName" maxlength="100"></div>
          <div class="field"><label for="merchantTablePhone">เบอร์โทรศัพท์ (ไม่บังคับ)</label><input id="merchantTablePhone" type="tel" maxlength="20"></div>
        </div>
        <p class="sub">จองโต๊ะรอบละ 2 ชั่วโมง กดใช้งานเสร็จเพื่อคืนโต๊ะได้ก่อนหมดเวลา</p>
        <button type="submit" class="btn primary" disabled>บันทึกการจองโต๊ะ</button>
      </form>
    </details>
    <p id="merchantActionStatus" role="status"></p>
    <div class="field">
      <label for="merchantBookingSearch">ค้นหาด้วยเลขจองหรือรหัสรายการ</label>
      <input id="merchantBookingSearch" type="search" autocomplete="off">
    </div>
    <div id="merchantBookings" aria-live="polite"></div>
  </section>
  <p id="merchantStatus" role="status"></p>
</main>
</body>
</html>
