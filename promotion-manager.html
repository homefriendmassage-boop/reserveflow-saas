<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการโปรตกกุ้ง · ReserveFlow</title><link rel="stylesheet" href="./assets/css/app.css"><script defer src="./assets/vendor/supabase-js/supabase.js"></script><script type="module" src="./src/features/promotion-manager.js"></script></head><body><header><div class="top"><div class="logo"><b>R</b>ReserveFlow · จัดการโปรโมชั่น</div><a href="./merchant.html" class="btn soft small">กลับหลังบ้าน</a></div></header><main><section class="panel"><h2>🎣 โปรโมชั่นตกกุ้ง — ยิ่งนานยิ่งคุ้ม</h2><p class="sub">ใช้ข้อมูลจริงของร้านผ่าน Supabase · ลดราคา หรือจ่ายเต็มแล้วรับของแถม · ไม่ให้สิทธิ์ซ้อนแพ็กเกจ</p><p id="authStatus" role="status"></p><form id="login" class="fields hidden"><label class="field">อีเมล<input type="email" name="email" required></label><label class="field">รหัสผ่าน<input type="password" name="password" required></label><button class="btn soft" type="submit">เข้าสู่ระบบ</button></form><button id="loginLine" class="btn soft hidden" type="button">เข้าสู่ระบบด้วย LINE</button><section id="editor" class="hidden"><label class="field">ร้านค้า <select id="shop"></select></label><p class="sub">ราคาอ้างอิง: 120 บาท/ชั่วโมง · ใช้แพ็กเกจของแถมหรือส่วนลดอย่างใดอย่างหนึ่งต่อการจอง</p><div class="inline-actions"><button id="loadDiscount" class="btn soft" type="button">ชุดโปรลดราคา 1–5 ชม.</button><button id="loadGift" class="btn soft" type="button">ชุดโปรแถมเครื่องดื่ม/อาหาร 1–5 ชม.</button></div><p id="feedback" role="status"></p><div id="offers"></div><h3>เพิ่ม / แก้ไขแพ็กเกจ</h3><form id="offerForm" class="fields"><input type="hidden" id="offerId"><label class="field">ชื่อโปร<input id="name" required maxlength="120" placeholder="เช่น ตกกุ้ง 3 ชม. ฟรีเครื่องดื่ม"></label><label class="field">ชั่วโมง<input id="hours" type="number" min="1" max="24" value="3" required></label><label class="field">ประเภท<select id="mode"><option value="gift">แถมอาหาร/เครื่องดื่ม</option><option value="discount">ลดราคาชั่วโมง</option></select></label><label class="field">ราคาแพ็กเกจ (บาท)<input id="price" type="number" min="0" step=".01" value="360" required></label><label class="field">รายการของแถม<input id="gift" placeholder="เช่น เครื่องดื่ม 1 แก้ว มูลค่าไม่เกิน 40 บาท"></label><label class="field">มูลค่าของแถม (บาท)<input id="giftValue" type="number" min="0" step=".01" value="0"></label><label class="field"><span>เปิดให้ใช้งาน</span><select id="active"><option value="true">เปิด</option><option value="false">ปิด</option></select></label><button class="btn primary" type="submit">บันทึกโปรโมชั่น</button><button class="btn soft" id="clear" type="button">สร้างรายการใหม่</button></form></section></section></main></body></html>
