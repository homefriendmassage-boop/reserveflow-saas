<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คูปองรับสิทธิ์ · ReserveFlow</title><link rel="stylesheet" href="./assets/css/app.css"></head><body><header><div class="top"><div class="logo"><b>R</b>ReserveFlow</div></div></header><main><section class="panel" style="max-width:540px;margin:auto;text-align:center"><h2>🎁 คูปองรับสิทธิ์</h2><p class="sub">แสดง QR นี้ให้พนักงานสแกนและยืนยันรับสิทธิ์ · 1 คูปองใช้ได้ 1 ครั้ง</p><img id="qr" alt="QR สำหรับรับสิทธิ์" style="display:none;width:100%;max-width:350px;height:auto;margin:auto"><p id="status" role="status">กำลังตรวจสอบคูปอง…</p><p class="sub">หากใช้สิทธิ์ไปแล้ว QR นี้จะไม่สามารถใช้ซ้ำได้</p></section></main><script type="module">import {SUPABASE_URL} from './src/data/supabase-config.js';const code=location.hash.slice(1)||new URLSearchParams(location.search).get('code')||'';const valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(code);const el=document.getElementById('status');if(!valid){el.textContent='รหัสคูปองไม่ถูกต้อง'}else{const url=new URL('/functions/v1/promotion-qr',SUPABASE_URL);url.searchParams.set('code',code);const img=document.getElementById('qr');img.onload=()=>{img.style.display='block';el.textContent='คูปองพร้อมใช้งาน'};img.onerror=()=>{img.style.display='none';el.textContent='คูปองนี้ถูกใช้แล้ว หมดอายุ หรือไม่สามารถใช้งานได้'};img.src=url.href}</script></body></html>
